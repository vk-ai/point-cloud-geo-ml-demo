# Tiny CPU-friendly defaults for the geometric ML demo
seed: 7
n_per_class: 40
n_points: 128
noise: 0.02
fps_points: 64
knn_k: 8
voxel_size: 0.25
# Voxel histogram reduction (Open3D-inspired teaching knob — numpy only, no Open3D).
# occupancy | count | max_count_bin
voxel:
  reduction: occupancy
# Fixed-N downsample: fps (PointNet-family default) | random (uniform baseline)
sampling: fps
# Deterministic FPS start (Open3D start_index teaching knob — numpy only).
fps:
  start_index: 0
test_size: 0.25
classifier: mlp   # mlp | logistic
mlp_hidden: [32, 16]
max_iter: 400
# Radius PCA normals + PointNet-lite (round 3). r must match cloud metric spacing.
normals:
  radius: 0.35
  min_nn: 4
pointnet_lite:
  enabled: true
  n_points: 48
  hidden: 24
  epochs: 30
  lr: 0.08
  compare_normals: true
# ICP registration demo (round 4): recover a known rigid transform on a synthetic
# cube (numpy + sklearn NearestNeighbors). large_angle_deg shows a local minimum.
registration:
  shape: cube
  angle_deg: 20.0
  large_angle_deg: 90.0
  max_translation: 0.2
  noise: 0.01
  max_corr_dist: 0.25
  max_iter: 50
  normals_radius: 0.35
# Seeded RANSAC plane segmentation (round 5): synthetic ground + tilted wall +
# uniform outliers. Same seed → bit-identical plane + inliers.
plane_segmentation:
  distance_threshold: 0.02
  num_iterations: 1000
  n_ground: 500
  n_wall: 250
  n_outliers: 150
  noise: 0.005
